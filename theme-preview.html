<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抖音内容归档 · 样式预览</title>
    <style>
      :root { color-scheme: light; --page:#f3eff8; --panel:#fff; --surface:#faf7ff; --border:#eadff7; --text:#30283a; --muted:#867a91; --soft:#f3ecfb; --accent1:#ff3a68; --accent2:#9a56ee; --green:#0d8a57; --green-bg:#e8faf1; --shadow:0 20px 55px rgba(79, 42, 109, .18); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
      :root[data-theme="dark"] { color-scheme: dark; --page:#17131e; --panel:#211c2a; --surface:#2a2435; --border:#41364e; --text:#f7f0fb; --muted:#b9aebe; --soft:#352b42; --accent1:#ff4f7b; --accent2:#a96cff; --green:#74e2b4; --green-bg:#1c3d34; --shadow:0 20px 55px rgba(0,0,0,.42); }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; padding:28px 18px; color:var(--text); background:radial-gradient(circle at 18% 0,rgba(184,102,242,.2),transparent 28%),var(--page); transition:background .25s,color .25s; }
      .intro { width:min(1120px,100%); margin:0 auto 15px; color:var(--muted); font-size:13px; line-height:1.55; text-align:center; }
      .browser { display:grid; grid-template-columns:minmax(0,1fr) 430px; width:min(1120px,100%); min-height:720px; margin:auto; overflow:hidden; border:1px solid color-mix(in srgb,var(--border) 80%,transparent); border-radius:23px; background:#15121b; box-shadow:var(--shadow); }
      .site { position:relative; overflow:hidden; padding:92px 30px 30px; color:#f5eff8; background:linear-gradient(145deg,#19151f,#2c2433); }.browser-bar { position:absolute; inset:0 0 auto; display:flex; align-items:center; gap:9px; height:58px; padding:0 18px; color:#c1b8c8; border-bottom:1px solid rgba(255,255,255,.08); background:#211b28; font-size:12px; }.dots { display:flex; gap:6px; }.dots i { width:9px; height:9px; border-radius:50%; background:#ff5f57; }.dots i:nth-child(2) { background:#ffbd2e; }.dots i:nth-child(3) { background:#28c840; }.address { flex:1; padding:8px 11px; border-radius:8px; color:#968a9f; background:#16121a; }.site-search { max-width:510px; margin:0 auto 20px; padding:12px 16px; border-radius:11px; color:#84788c; background:#fff; font-size:13px; }.site-tabs { display:flex; gap:21px; max-width:510px; margin:0 auto 18px; color:#c7bfcc; font-size:14px; }.site-tabs b { color:#fff; }.cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; max-width:510px; margin:auto; }.card { min-height:195px; overflow:hidden; border-radius:12px; background:#3b3244; }.card::before { content:""; display:block; height:136px; background:linear-gradient(135deg,#b95b86,#5c4d83 55%,#cc9470); }.card:nth-child(2)::before { background:linear-gradient(135deg,#775a48,#c7aa85 57%,#5f5f73); }.card:nth-child(3)::before { background:linear-gradient(135deg,#a18376,#494157 54%,#cf80a2); }.card span { display:block; padding:9px; color:#ece7ee; font-size:11px; line-height:1.45; }.side-panel { min-width:0; overflow:auto; border-left:1px solid var(--border); background:var(--panel); }
      .popup { width:100%; padding:18px; background:color-mix(in srgb,var(--panel) 94%,transparent); }
      .header,.brand,.theme-group,.filter-toggle,.scan-row { display:flex; align-items:center; }
      .header { justify-content:space-between; margin-bottom:16px; }.brand { gap:11px; }.brand-mark { display:grid; place-items:center; width:39px; height:39px; border-radius:13px; color:#fff; font-size:20px; background:linear-gradient(135deg,var(--accent1),var(--accent2)); box-shadow:0 8px 18px color-mix(in srgb,var(--accent2) 31%,transparent); } h1 { margin:0; font-size:17px; }.header p { margin:3px 0 0; color:var(--muted); font-size:12px; }.status { padding:6px 9px; border-radius:999px; color:var(--green); background:var(--green-bg); font-size:12px; font-weight:650; }
      .theme-card { display:grid; gap:9px; margin-bottom:12px; padding:11px 12px; border:1px solid var(--border); border-radius:13px; background:var(--surface); }.theme-title { color:var(--muted); font-size:12px; }.theme-group { gap:6px; }.theme-group button { flex:1; padding:8px 6px; border:1px solid transparent; border-radius:9px; color:var(--muted); cursor:pointer; background:transparent; font-size:12px; }.theme-group button:hover { background:var(--soft); }.theme-group button.selected { color:var(--text); border-color:var(--border); background:var(--panel); font-weight:700; }
      .filter-toggle { justify-content:space-between; width:100%; margin-bottom:10px; padding:10px 12px; border:1px solid var(--border); border-radius:13px; color:var(--text); background:var(--panel); font-size:13px; font-weight:700; }.filter-toggle #summary { margin-left:auto; margin-right:14px; color:var(--muted); font-size:11px; font-weight:500; }
      .filter-panel { display:grid; gap:13px; margin-bottom:14px; padding:14px; border:1px solid var(--border); border-radius:16px; background:linear-gradient(145deg,var(--panel),var(--surface)); }.filter-panel fieldset { margin:0; padding:0; border:0; }.filter-panel legend { margin-bottom:8px; color:var(--muted); font-size:12px; }.options { display:flex; flex-wrap:wrap; gap:6px; }.options button { padding:7px 9px; border:0; border-radius:9px; color:var(--text); background:transparent; font-size:12px; }.options button.selected { color:var(--accent1); background:linear-gradient(100deg,color-mix(in srgb,var(--accent1) 14%,transparent),color-mix(in srgb,var(--accent2) 14%,transparent)); }.filter-panel p { margin:7px 0 0; color:var(--muted); font-size:10px; }
      .settings { display:grid; grid-template-columns:1fr 1.3fr; gap:10px; margin-bottom:12px; }.settings label,.scan-range label { display:grid; gap:6px; color:var(--muted); font-size:12px; }.field { min-width:0; padding:10px 11px; border:1px solid var(--border); border-radius:11px; color:var(--text); background:var(--panel); font-size:12px; }.directory-row { display:flex; gap:6px; min-width:0; }.directory { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.directory-setting { flex:0 0 auto; padding:0 8px; border:1px solid var(--border); border-radius:11px; color:var(--accent2); background:var(--surface); font-size:11px; font-weight:650; }
      .scan-range { display:grid; gap:6px; margin-bottom:12px; padding:11px 12px; border:1px solid var(--border); border-radius:13px; background:var(--surface); }.scan-row { gap:8px; }.scan-row select,.scan-row input { min-width:0; padding:9px 10px; border:1px solid var(--border); border-radius:9px; color:var(--text); outline:none; background:var(--panel); font-size:12px; }.scan-row select { flex:1; }.scan-row input { width:102px; }.scan-note { margin:0; color:var(--muted); font-size:10px; }
      .primary { width:100%; padding:12px; border:0; border-radius:13px; color:#fff; background:linear-gradient(100deg,var(--accent1),var(--accent2)); font-size:14px; font-weight:700; box-shadow:0 10px 18px color-mix(in srgb,var(--accent1) 23%,transparent); } footer { margin-top:17px; color:var(--muted); font-size:11px; text-align:center; }
    </style>
  </head>
  <body>
    <p class="intro">右侧边栏预览：点击扩展图标后，归档界面固定显示在浏览器右侧；此页面仅展示样式，不执行扫描或下载。</p>
    <div class="browser">
      <section class="site" aria-label="抖音搜索页示意">
        <div class="browser-bar"><span class="dots"><i></i><i></i><i></i></span><span class="address">douyin.com/search/女帽子</span></div>
        <div class="site-search">🔍 女帽子</div><div class="site-tabs"><b>综合</b><span>视频</span><span>图文</span><span>用户</span></div>
        <div class="cards"><div class="card"><span>复古草编帽 · 夏日穿搭</span></div><div class="card"><span>女帽子搭配分享</span></div><div class="card"><span>显脸小的棒球帽</span></div></div>
      </section>
      <aside class="side-panel" aria-label="抖音内容归档侧边栏"><main class="popup">
      <header class="header"><div class="brand"><div class="brand-mark">↓</div><div><h1>抖音内容归档</h1><p>等待扫描当前页面</p></div></div><span class="status">已连接</span></header>
      <section class="theme-card" aria-label="界面皮肤"><span class="theme-title">界面皮肤</span><div class="theme-group"><button class="selected" data-theme="system" type="button">◐ 跟随系统</button><button data-theme="light" type="button">☀ 浅色</button><button data-theme="dark" type="button">☾ 深色</button></div></section>
      <div class="filter-toggle"><span>筛选</span><span id="summary">不限 · 最多点赞 · 不限时间</span><span>⌃</span></div>
      <section class="filter-panel" aria-label="归档筛选">
        <fieldset><legend>排序依据</legend><div class="options"><button>综合排序</button><button>最新发布</button><button class="selected">最多点赞</button></div></fieldset>
        <fieldset><legend>发布时间</legend><div class="options"><button class="selected">不限</button><button>一天内</button><button>一周内</button><button>半年内</button></div></fieldset>
        <fieldset><legend>内容形式</legend><div class="options"><button class="selected">不限</button><button>视频</button><button>图文</button></div></fieldset>
      </section>
      <section class="settings"><label>归档日期<span class="field">2026/08/25</span></label><label>下载目录<div class="directory-row"><span class="field directory">📁 Downloads/日期_搜索词</span><button class="directory-setting" type="button">选择位置</button></div></label></section>
      <section class="scan-range" aria-label="扫描范围"><label for="scan-limit">扫描范围</label><div class="scan-row"><select id="scan-limit"><option value="10">前 10 条已加载内容</option><option value="20">前 20 条已加载内容</option><option value="30" selected>前 30 条已加载内容</option><option value="50">前 50 条已加载内容</option><option value="100">前 100 条已加载内容</option><option value="custom">自定义数量</option></select><input id="custom-limit" type="number" min="1" placeholder="条数" hidden /></div><p class="scan-note">扫描时仅处理当前网页已加载内容中的前 N 条。</p></section>
      <button class="primary" type="button">扫描当前已加载内容</button>
      <footer>下载内容仅供个人整理使用</footer>
      </main></aside>
    </div>
    <script>
      const root = document.documentElement;
      const buttons = [...document.querySelectorAll('[data-theme]')];
      const preferred = window.matchMedia('(prefers-color-scheme: dark)');
      let mode = 'system';
      function setTheme(next) { mode = next; root.dataset.theme = next === 'system' ? (preferred.matches ? 'dark' : 'light') : next; buttons.forEach((button) => button.classList.toggle('selected', button.dataset.theme === next)); }
      buttons.forEach((button) => button.addEventListener('click', () => setTheme(button.dataset.theme)));
      preferred.addEventListener('change', () => { if (mode === 'system') setTheme('system'); });
      document.querySelector('#scan-limit').addEventListener('change', (event) => { document.querySelector('#custom-limit').hidden = event.target.value !== 'custom'; });
      setTheme('system');
    </script>
  </body>
</html>
